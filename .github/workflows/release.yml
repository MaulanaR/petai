name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Ensure NSIS
        shell: pwsh
        run: |
          $nsis = 'C:\Program Files (x86)\NSIS'
          if (-not (Test-Path "$nsis\makensis.exe")) { choco install nsis -y --no-progress }
          Add-Content $env:GITHUB_PATH $nsis

      # package main embeds frontend/dist, which only exists after the Wails build; it has no tests.
      - name: Test
        run: go test ./internal/... ./cmd/...

      - name: Build (portable exe + NSIS installer)
        shell: pwsh
        run: |
          $v = $env:TAG.TrimStart('v')
          $cfg = Get-Content wails.json -Raw | ConvertFrom-Json
          $cfg.info.productVersion = $v
          [IO.File]::WriteAllText("$PWD\wails.json", ($cfg | ConvertTo-Json -Depth 5))
          wails build -clean -trimpath -nsis -o petai.exe -ldflags "-X main.appVersion=$v"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem build/bin

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item build/bin/petai.exe "dist/PetAI-$env:TAG-windows-amd64-portable.exe"
          $installer = Get-ChildItem build/bin -Filter '*installer*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer not produced' }
          Copy-Item $installer.FullName "dist/PetAI-$env:TAG-windows-amd64-setup.exe"
          Get-ChildItem dist -Filter *.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content dist/SHA256SUMS.txt
          Get-ChildItem dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: PetAI ${{ env.TAG }}
          body_path: docs/RELEASE_NOTES.md
          files: dist/*
